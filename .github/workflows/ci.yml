name: ci

on:
  push:
  pull_request:
  schedule:
    - cron: "11 7 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: typecheck, test, audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        node-version: ["22.14.0"]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Sonar API unit tests
        run: node --test functions/_lib/sonar.test.mjs

      - name: Sonar redirect budget
        run: node scripts/check-redirects.mjs

      - name: Build Pages Functions
        run: npx --yes wrangler@4.86.0 pages functions build functions --outdir "$RUNNER_TEMP/sonar-fns"

      - name: ORVUPI Verify offline tests and read-only scan
        run: |
          node --test --test-reporter=spec "dist/verify/**/*.test.js"
          npm run verify:scan

      - name: Public log verifies
        run: npm run logs:verify

      - name: Public log is append-only
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail
          if [ -z "${BASE_SHA:-}" ] || ! git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
            echo "Sin commit base con el que comparar. Se omite."
            exit 0
          fi
          base_dir="$RUNNER_TEMP/base"
          mkdir -p "$base_dir"
          if git cat-file -e "${BASE_SHA}:logs" 2>/dev/null; then
            git archive "$BASE_SHA" logs | tar -x -C "$base_dir"
          fi
          mkdir -p "$base_dir/logs"
          node dist/src/cli.js logs:check-update "$base_dir/logs" logs --any

      - name: Forbidden API scan
        run: npm run scan:forbidden

      - name: PPM status
        run: npm run ppm:print --silent > ppm-status.json

      - name: PPM marks logs, limits and kill-switch; wallet not-applicable
        run: |
          jq -e '
            def run: test("^https://github\\.com/ORVUPI/orvupi-agent/actions/runs/[0-9]+$");
            .approved == false and
            .ppmMarkedCount == 2 and
            .ppmTotal == 4 and
            .ppmNotApplicableCount == 1 and
            .boxes.wallet.status == "not-applicable" and
            .boxes.wallet.ppmMarked == false and
            .boxes.wallet.publicEvidence == null and
            .boxes.wallet.notApplicableOn == "2026-10-05" and
            .boxes.logs.ppmMarked == false and
            .boxes.logs.publicEvidence == null and
            .boxes.limits.ppmMarked == true and
            (.boxes.limits.publicEvidence | run) and
            .boxes.killSwitch.ppmMarked == true and
            .boxes.killSwitch.publicDrill == true and
            (.boxes.killSwitch.publicDrills | length >= 2) and
            (.boxes.killSwitch.publicDrills | all(run))
          ' ppm-status.json

      - name: Audit
        run: npm audit --audit-level=high

      - name: verify:all (H8)
        env:
          VERIFY_OUT_DIR: verify-out
        run: |
          mkdir -p verify-out
          npm run verify:all

      - name: Upload verify:all report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: verify-report
          path: |
            verify-out/verify-report.json
            verify-out/verify-report.md
          if-no-files-found: error
          retention-days: 14

      - name: Checksums
        run: sha256sum test-report.json ppm-status.json policy/limits.json package-lock.json > SHA256SUMS

      - name: Upload report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-report
          path: |
            test-report.json
            ppm-status.json
            SHA256SUMS
          if-no-files-found: error
          retention-days: 14

  browser:
    name: playwright library and notebook
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22.14.0"
          cache: npm

      - name: Install
        run: npm ci

      - name: Install browsers
        # El espejo apt del runner a veces se queda parado: apt con reintentos y tiempo límite, y 3 intentos de 6 min
        # (si un intento se corta, se mata su apt-get para liberar el bloqueo de dpkg).
        run: |
          printf 'Acquire::Retries "5";\nAcquire::http::Timeout "30";\nAcquire::https::Timeout "30";\n' | sudo tee /etc/apt/apt.conf.d/99red >/dev/null
          for i in 1 2 3; do
            timeout 360 npx playwright install --with-deps chromium webkit && exit 0
            echo "intento $i fallido"; sudo pkill -9 -x apt-get || true; sudo pkill -9 -x dpkg || true; sleep 3; sudo dpkg --configure -a || true
            # El espejo de Azure es el que se atasca: los siguientes intentos usan el de Ubuntu.
            printf 'http://archive.ubuntu.com/ubuntu/\tpriority:1\nhttp://azure.archive.ubuntu.com/ubuntu/\tpriority:2\n' | sudo tee /etc/apt/apt-mirrors.txt >/dev/null
          done
          exit 1

      - name: Browser tests
        run: npm run test:browser

  ui:
    name: playwright
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22.14.0"
          cache: npm

      - name: Install
        run: npm ci

      - name: Install browsers
        # El espejo apt del runner a veces se queda parado: apt con reintentos y tiempo límite, y 3 intentos de 6 min
        # (si un intento se corta, se mata su apt-get para liberar el bloqueo de dpkg).
        run: |
          printf 'Acquire::Retries "5";\nAcquire::http::Timeout "30";\nAcquire::https::Timeout "30";\n' | sudo tee /etc/apt/apt.conf.d/99red >/dev/null
          for i in 1 2 3; do
            timeout 360 npx playwright install --with-deps chromium webkit && exit 0
            echo "intento $i fallido"; sudo pkill -9 -x apt-get || true; sudo pkill -9 -x dpkg || true; sleep 3; sudo dpkg --configure -a || true
            # El espejo de Azure es el que se atasca: los siguientes intentos usan el de Ubuntu.
            printf 'http://archive.ubuntu.com/ubuntu/\tpriority:1\nhttp://azure.archive.ubuntu.com/ubuntu/\tpriority:2\n' | sudo tee /etc/apt/apt-mirrors.txt >/dev/null
          done
          exit 1

      - name: Playwright
        run: npx playwright test

  i18n:
    name: idiomas (5)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22.14.0"
          cache: npm

      - name: Install
        run: npm ci

      - name: Páginas por idioma al día (falla si falta una traducción o hay que regenerar)
        run: |
          set -euo pipefail
          python3 scripts/i18n/make_catalogs.py
          python3 scripts/i18n/build_web.py
          python3 -c "import json,sys; m=json.load(open('i18n/web/missing.json')); bad={k:v for k,v in m.items() if v}; print(bad) if bad else None; sys.exit(1 if bad else 0)"
          git diff --exit-code -- web/v2 i18n apps/work/src/i18n

      - name: Build ORVUPI Work en web/v2/work (como en producción)
        run: |
          set -euo pipefail
          cd apps/work
          npm ci
          npx vite build --base /work/ --outDir ../../web/v2/work --emptyOutDir

      - name: Install browsers
        # El espejo apt del runner a veces se queda parado: apt con reintentos y tiempo límite, y 3 intentos de 6 min
        # (si un intento se corta, se mata su apt-get para liberar el bloqueo de dpkg).
        run: |
          printf 'Acquire::Retries "5";\nAcquire::http::Timeout "30";\nAcquire::https::Timeout "30";\n' | sudo tee /etc/apt/apt.conf.d/99red >/dev/null
          for i in 1 2 3; do
            timeout 360 npx playwright install --with-deps chromium firefox webkit && exit 0
            echo "intento $i fallido"; sudo pkill -9 -x apt-get || true; sudo pkill -9 -x dpkg || true; sleep 3; sudo dpkg --configure -a || true
            # El espejo de Azure es el que se atasca: los siguientes intentos usan el de Ubuntu.
            printf 'http://archive.ubuntu.com/ubuntu/\tpriority:1\nhttp://azure.archive.ubuntu.com/ubuntu/\tpriority:2\n' | sudo tee /etc/apt/apt-mirrors.txt >/dev/null
          done
          exit 1

      - name: Playwright en los cinco idiomas
        run: npx playwright test -c playwright.i18n.config.mjs --project=chromium-desktop --project=firefox-tablet --project=webkit-mobile

  work:
    name: orvupi work
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: apps/work
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22.14.0"
          cache: npm
          cache-dependency-path: apps/work/package-lock.json

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Install browser
        # El espejo apt del runner a veces se queda parado: apt con reintentos y tiempo límite, y 3 intentos de 6 min
        # (si un intento se corta, se mata su apt-get para liberar el bloqueo de dpkg).
        run: |
          printf 'Acquire::Retries "5";\nAcquire::http::Timeout "30";\nAcquire::https::Timeout "30";\n' | sudo tee /etc/apt/apt.conf.d/99red >/dev/null
          for i in 1 2 3; do
            timeout 360 npx playwright install --with-deps chromium webkit firefox && exit 0
            echo "intento $i fallido"; sudo pkill -9 -x apt-get || true; sudo pkill -9 -x dpkg || true; sleep 3; sudo dpkg --configure -a || true
            # El espejo de Azure es el que se atasca: los siguientes intentos usan el de Ubuntu.
            printf 'http://archive.ubuntu.com/ubuntu/\tpriority:1\nhttp://azure.archive.ubuntu.com/ubuntu/\tpriority:2\n' | sudo tee /etc/apt/apt-mirrors.txt >/dev/null
          done
          exit 1

      - name: End to end
        run: npm run test:e2e

  secrets:
    name: gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Gitleaks PR history
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          version="8.30.1"
          archive="gitleaks_${version}_linux_x64.tar.gz"
          checksum="551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
          curl -fsSL -o "${archive}" "https://github.com/gitleaks/gitleaks/releases/download/v${version}/${archive}"
          echo "${checksum}  ${archive}" | sha256sum -c -
          tar -xzf "${archive}" gitleaks
          # Solo el rango de esta rama (base...head). No recorre feat/web-v2 ni las demás ramas.
          if [ -n "${PR_BASE_SHA}" ]; then
            base="$(git merge-base "${PR_BASE_SHA}" HEAD)"
          elif git rev-parse --verify origin/main >/dev/null 2>&1; then
            base="$(git merge-base origin/main HEAD)"
          else
            base=""
          fi
          if [ -z "${base}" ] || [ "${base}" = "$(git rev-parse HEAD)" ]; then
            range="HEAD"
          else
            range="${base}..HEAD"
          fi
          echo "gitleaks range: ${range}"
          ./gitleaks detect --source . --redact --no-banner --exit-code 1 --log-opts="${range}"
          probe="$(mktemp -d)"
          detected=0
          for _attempt in 1 2 3 4 5; do
            seed="$(python3 -c 'import random; alphabet="123456789ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz"; rng=random.SystemRandom(); print("".join(rng.choice(alphabet) for _ in range(44)))')"
            printf '{"tokenAccount":"%s"}\n' "$seed" > "${probe}/config.json"
            set +e
            ./gitleaks detect --no-git --source "$probe" --redact --no-banner --exit-code 1 > /tmp/gitleaks-probe.txt 2>&1
            code=$?
            set -e
            if [ "$code" -eq 1 ]; then
              detected=1
              break
            fi
          done
          rm -rf "$probe"
          if [ "$detected" -ne 1 ]; then
            echo "una semilla falsa bajo tokenAccount en otro archivo no se detectó"
            cat /tmp/gitleaks-probe.txt || true
            exit 1
          fi

  attest:
    name: attest test report
    needs: verify
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Download report
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: test-report
          path: report

      - name: Attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            report/test-report.json
            report/ppm-status.json
            report/SHA256SUMS
