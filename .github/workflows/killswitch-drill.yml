name: killswitch-drill

on:
  schedule:
    - cron: "17 8 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: killswitch-drill-${{ github.ref }}
  cancel-in-progress: false

jobs:
  drill:
    name: kill-switch drill
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.14.0"
          cache: npm

      - name: Install
        run: npm ci

      - name: Drill
        run: npm run drill:killswitch

      - name: Checksums
        if: always()
        run: sha256sum drill-report.json drill-report.md > drill-SHA256SUMS

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: killswitch-drill-report
          path: |
            drill-report.json
            drill-report.md
            drill-SHA256SUMS
          if-no-files-found: error
          retention-days: 90
